<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}iframe{border:0;width:100%;height:780px;display:block}</style></head><body>
<iframe id="viewer" title="Edytor konstrukcji drewnianej"></iframe>
<script>
const viewer=document.getElementById('viewer');
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');}
window.addEventListener('message',event=>{
 if(event.source===window.parent&&event.data.type==='streamlit:render'){
  viewer.srcdoc=event.data.args.html;
  send('streamlit:setFrameHeight',{height:780});
 }
 if(event.source===viewer.contentWindow&&event.data?.type==='kumiki:apply'){
  send('streamlit:setComponentValue',{value:event.data.request,dataType:'json'});
 }
});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
