name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app.py"
      - "requirements.txt"
      - "launcher.py"
      - ".github/workflows/build-macos.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "Konstruktor Wiat 3D" \
            --add-data "app.py:." \
            --collect-all streamlit \
            --collect-all plotly \
            launcher.py

      - name: Verify app contents
        run: |
          test -d "dist/Konstruktor Wiat 3D.app"
          find "dist/Konstruktor Wiat 3D.app" -name "app.py" -print
          test -n "$(find "dist/Konstruktor Wiat 3D.app" -name "app.py" -print -quit)"

      - name: Ad-hoc sign app
        run: |
          codesign --force --deep --sign - "dist/Konstruktor Wiat 3D.app"
          codesign --verify --deep --strict "dist/Konstruktor Wiat 3D.app"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Konstruktor Wiat 3D.app" "Konstruktor-Wiat-3D-v1.5-macOS.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Konstruktor-Wiat-3D-v1.5-macOS
          path: Konstruktor-Wiat-3D-v1.5-macOS.zip
